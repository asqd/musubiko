[workspace]
resolver = "3"
members = [
    "core/musubiko-core",
    "core/musubiko-cli",
    "apps/desktop/src-tauri",
    "apps/desktop/bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
musubiko-core = { path = "core/musubiko-core" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[profile.release]
debug = false
lto = "thin"
strip = "debuginfo"
